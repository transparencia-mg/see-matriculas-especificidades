name: see-matriculas-especificidades
owner_org: secretaria-de-estado-de-educacao-de-minas-gerais
profile: data-package
resources:
- description: Matrículas da rede estadual de Minas Gerais por especificidade da turma, SRE, município e mês, ano letivo 2023.
  dialect:
    delimiter: ;
  encoding: utf-8-sig
  format: csv
  hashing: md5
  name: see-matriculas-especificidades-2023
  path: data/see-matriculas-especificidades-2023.csv
  profile: tabular-data-resource
  schema:
    fields:
    - name: ano
      type: integer
      title: Ano letivo
      description: Ano letivo das matrículas.
    - name: mes
      type: integer
      title: Mês de referência
      description: Mês de referência (2 = fevereiro a 12 = dezembro). A contagem considera as matrículas ativas no último dia do mês.
    - name: cod_sre
      type: string
      title: Código da SRE
      description: Código da Superintendência Regional de Ensino (SRE), com 6 dígitos.
    - name: nome_sre
      type: string
      title: Nome da SRE
      description: Nome da Superintendência Regional de Ensino.
    - name: cod_municipio_ibge
      type: string
      title: Código IBGE do município
      description: Código IBGE do município (7 dígitos) do endereço de funcionamento da turma.
    - name: nome_municipio
      type: string
      title: Município
      description: Nome do município.
    - name: especificidade
      type: string
      title: Especificidade
      description: 'Especificidade da turma: Educação Especial - AEE (Sala de Recursos), Educação Especial - Escola Exclusiva, Quilombola, Indígena, Socioeducativo ou Prisional. As categorias não são exclusivas e não devem ser somadas entre si. AEE (Sala de Recursos) disponível a partir de 2026.'
    - name: qtd_matriculas
      type: integer
      title: Quantidade de matrículas
      description: Quantidade de matrículas ativas no último dia do mês. Vazio quando o valor foi suprimido (1 a 4 matrículas) para proteção de dados pessoais (LGPD).
    - name: suprimido
      type: string
      title: Valor suprimido
      description: S = quantidade ocultada para proteção de dados pessoais (LGPD); N = quantidade divulgada.
  scheme: file
  title: Matrículas por especificidade - 2023
